[build-system]
requires = [
  "scikit-build-core>=0.11",
  "pybind11>=2.11",
  "setuptools_scm>=8"
]
build-backend = "scikit_build_core.build"

[project]
name = "pybrass"
dynamic = ["version"]
description = "Binary Reader and Analysis Suite Software"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.8"
authors = [
  { name = "Carl B. Rosenkvist", email = "rosenkvist@itp.uni-frankfurt.de" }
]
license = { file = "LICENSE" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: C++",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Physics",
]
keywords = ["binary", "reader", "physics", "heavy-ion", "SMASH", "pybind11"]

dependencies = []

[project.urls]
Homepage = "https://github.com/Carl-Rosenkvist/brass"
Source = "https://github.com/Carl-Rosenkvist/brass"
Issues = "https://github.com/Carl-Rosenkvist/brass/issues"

[tool.scikit-build]
cmake.source-dir = "."
build-dir = "build/{wheel_tag}"
cmake.version = ">=3.18"
cmake.build-type = "Release"
cmake.args = ["-DBUILD_PYTHON=ON", "-DBUILD_TESTS=OFF"]

wheel.packages = ["pythonlib/brass"]

sdist.include = [
  "CMakeLists.txt",
  "src/**/*",
  "include/**/*",
  "tests/**/*",
  "pythonlib/brass/**/*",
  "README.md",
  "LICENSE"
]

[tool.scikit-build.metadata]
version.provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]
version_scheme = "no-guess-dev"
local_scheme = "node-and-date"

[tool.cibuildwheel]
build = "cp3?-*"
skip = "pp* *-musllinux_*"
test-requires = ["pytest"]
environment = { CMAKE_BUILD_PARALLEL_LEVEL = "1" }
